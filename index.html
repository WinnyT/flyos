<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body style="
  font-family: 'Times New Roman', Times, serif;
  height: 100vh;
  background-image: url('/Users/winnytran/Desktop/Developer/HackClub/flyos/world_map.jpg');
  background-size: cover;
  background-repeat: no-repeat;
  margin: 0px;
">


  <div 
  style="background-color: rgba(0,0,0,0.25);
  color: #fff;
  display: flex;
  padding: 6px 12px;
  align-items: center;
  backdrop-filter: blur(8px);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 13px;
  justify-content: space-between;">


    <span
  id="flyosMenu"
  style="
    background: rgba(255,255,255,0.25);
    padding: 4px 12px;
    border-radius: 9999px;
    font-weight: 600;
    cursor: pointer;
    ">
    FlyOS
    </span>

    <span style= 
      "background: rgba(255,255,255,0.25);
      padding: 4px 12px;
      border-radius: 9999px;
      font-weight: 600;"
      id="timeElement">
        Time
    </span>
  </div>

  <script>
    function updateTime() {
      var currentTime = new Date().toLocaleString();
      var timeText = document.querySelector("#timeElement");
      timeText.innerHTML = currentTime;
    }
    setInterval(updateTime, 1000);
  </script>

  <div id="welcome"
    style="border: solid; display: flex; flex-direction: column; border-radius: 16px; position: absolute; top: calc(50% - 90px); left: calc(50% - 180px); backdrop-filter: blur(4px); background-color: rgba(0, 0, 0, 0.125); ">
    <div id="welcomeheader"
      style="width: 100%; display: flex; align-items: center; cursor: move; justify-content: center; margin-top: 8px;">
      <p style="margin: 0px; color: #fff; font-weight: 500">Welcome</p>
    </div>
    <div
  id="welcomeclose"
  style="
    position: absolute;
    top: 10px;
    left: 10px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background-color: #ff5f57;
    border: 1px solid #e0443e;
    cursor: pointer;
    z-index: 10;
  ">
</div>
    <div style="background-color: #fff; margin: 6px; border-radius: 12px; width: 360px; padding: 16px;">
      <h1 style="margin: 4px;">FlyOs</h1>
      <p style="margin: 0px;">
        FlyOS is a web-based operating system that allows you to run applications and access files directly from your web browser. It provides a user-friendly interface and a variety of features to enhance your online experience.
      </p>
    </div>
  </div>
  


<button
  id="georgiaOpen"
  aria-label="Open Georgia"
  style="
    position: absolute;

    left: 24.5%;
    top: 49%;
    transform: translate(-50%, -50%);

    width: 20px;
    height: 20px;

    border-radius: 50%;
    border: none;
    background: transparent;

    cursor: pointer;
    z-index: 2;
  ">
</button>

<script src="./script.js"></script>

</body>
</html>
