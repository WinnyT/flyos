<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlyOS</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #84BCDA, #bde0fe);
      min-height: 100vh;
      color: #1f2937;
    }

    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 48px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 16px;

      background-color: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(12px);

      color: white;
      z-index: 1000;
    }

    .topbar p {
      margin: 0;
    }

    .logo {
      font-weight: bold;
      letter-spacing: 1px;
    }

    .desktop {
      min-height: 100vh;
      padding: 100px 20px 40px;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .window {
      width: min(700px, 90vw);

      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(15px);

      border-radius: 20px;

      padding: 32px;

      text-align: center;

      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.18);
    }

    .window h1 {
      margin-top: 0;
      font-size: 42px;
    }

    .window h2 {
      margin-bottom: 8px;
    }

    .window p {
      color: #4b5563;
    }

    .hero-image {
      width: 100%;
      max-width: 500px;
      height: auto;

      margin-top: 20px;

      border-radius: 16px;

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.15);
    }

    .github-button {
      display: inline-block;

      margin-top: 24px;
      padding: 12px 20px;

      background-color: #1f2937;
      color: white;

      text-decoration: none;

      border-radius: 10px;

      transition: 0.2s;
    }

    .github-button:hover {
      transform: translateY(-2px);
      background-color: #111827;
    }
  </style>
</head>

<body>

  <!-- FlyOS menu bar -->
  <div class="topbar">

    <p class="logo">
      flyOS
    </p>

    <p id="timeElement"></p>

  </div>

  <main class="desktop">

    <div class="window">

      <h1>Welcome to FlyOS</h1>

      <h2>Introduction</h2>

      <p>
        Hello World! Welcome aboard.
      </p>

      <img
        class="hero-image"
        src="https://cdn.hackclub.com/019d2a90-4077-7026-aaeb-226301f2d0a9/2026_03_26_0hk_Kleki%20(1).png"
        alt="FlyOS image"
      >

      <br>

      <a
        class="github-button"
        href="https://github.com/WinnyT/flyos"
        target="_blank"
      >
        View my GitHub
      </a>

    </div>

  </main>


  <script>
    function updateTime() {
      var currentTime = new Date().toLocaleTimeString();

      var timeText = document.querySelector("#timeElement");

      timeText.innerHTML  = currentTime;
    }

    updateTime();

    setInterval(updateTime, 1000);
  </script>

</body>

</html>
